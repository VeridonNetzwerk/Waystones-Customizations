modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/VeridonNetzwerk/Waystones-Customizations/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''${mod_description}'''
logoFile = "waystonescustomizations_icon.png"
displayURL = "https://github.com/VeridonNetzwerk/Waystones-Customizations"

[[mixins]]
config = "waystonescustomizations.mixins.json"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${neo_mc_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "waystones"
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"
