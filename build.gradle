plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.4' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

def target = (findProperty('mc') ?: property('default_mc')).toString()
def versionProps = new Properties()
file("versions/${target}.properties").withInputStream { versionProps.load(it) }

subprojects {
    versionProps.each { k, v -> project.ext.set(k as String, v) }

    // Each Minecraft version gets its own build folder. -PbuildRoot=C:/short/path helps on Windows when
    // the project path is so long that NeoForge's setup hits the 260 character path limit.
    def buildRoot = findProperty('buildRoot')
    layout.buildDirectory = buildRoot ? file("${buildRoot}/${project.name}-${target}") : file("build/${target}")

    apply plugin: 'java'

    group = 'dev.waystonescustomizations'
    version = "${mod_version}+${minecraft_version}-${project.name}"
    base.archivesName = 'waystones-customizations'

    repositories {
        maven {
            url = 'https://maven.twelveiterations.com/repository/maven-public/'
            content { includeGroup 'net.blay09.mods' }
        }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
        withSourcesJar()
    }

    // Shared code + assets live in /common and are compiled into every loader jar.
    sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
    sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')
    // The few classes that differ between Minecraft versions (see code_variant in versions/*.properties)
    sourceSets.main.java.srcDir rootProject.file("common/src/${code_variant}/java")

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = java_version as int
    }

    processResources {
        def props = [
                mod_id               : mod_id,
                mod_name             : mod_name,
                mod_version          : version,
                mod_license          : mod_license,
                mod_author           : mod_author,
                mod_description      : mod_description,
                minecraft_version    : minecraft_version,
                neo_mc_range         : neo_mc_range,
                fabric_mc_range      : fabric_mc_range,
                fabric_loader_version: fabric_loader_version,
        ]
        inputs.properties props
        filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
            expand props
        }
    }

    jar {
        from(rootProject.file('LICENSE')) { rename { "LICENSE_${mod_id}" } }
    }
}
